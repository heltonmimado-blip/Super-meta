
<div class="library-section">
  <h2>📚 Biblioteca Escolar</h2>

  <select id="libraryLevel">
    <option value="">Selecionar classe</option>
    <option>1ª classe</option>
    <option>2ª classe</option>
    <option>3ª classe</option>
    <option>4ª classe</option>
    <option>5ª classe</option>
    <option>6ª classe</option>
    <option>7ª classe</option>
    <option>8ª classe</option>
    <option>9ª classe</option>
    <option>10ª classe</option>
    <option>11ª classe</option>
    <option>12ª classe</option>
  </select>

  <select id="librarySubject">
    <option value="">Selecionar disciplina</option>
    <option>Matemática</option>
    <option>Português</option>
    <option>Inglês</option>
    <option>Física</option>
    <option>Química</option>
    <option>Biologia</option>
    <option>História</option>
    <option>Geografia</option>
    <option>TIC</option>
  </select>

  <button onclick="searchSchoolBooks()">
    Pesquisar manuais
  </button>

  <div id="onlineBooks"></div>
</div>

<div class="ai-section">
  <h2>🤖 Pergunta à Super Meta IA</h2>

  <textarea
    id="aiQuestion"
    placeholder="Escreve a tua pergunta..."
  ></textarea>

  <button onclick="askSuperMeta()">
    Perguntar à Super Meta
  </button>

  <div id="aiAnswer"></div>
</div>

<script>
const SCHOOL_BOOK_SOURCES = [
  {
    name: "Ministério da Educação",
    url: "https://www.mined.gov.mz/"
  },
  {
    name: "IEDA",
    url: "https://ieda.gov.mz/"
  }
];

function searchSchoolBooks() {
  const level =
    document.getElementById("libraryLevel").value;

  const subject =
    document.getElementById("librarySubject").value;

  const container =
    document.getElementById("onlineBooks");

  container.replaceChildren();

  if (!level || !subject) {
    container.textContent =
      "Seleciona a classe e a disciplina.";
    return;
  }

  const title = document.createElement("h3");
  title.textContent = "Manuais: " + level + " · " + subject;
  container.appendChild(title);

  SCHOOL_BOOK_SOURCES.forEach(source => {
    const card = document.createElement("div");
    const name = document.createElement("strong");
    const link = document.createElement("a");

    card.className = "book";
    name.textContent = source.name;

    link.href = source.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Consultar fonte oficial";

    card.append(name, document.createElement("br"), link);
    container.appendChild(card);
  });

  const search = document.createElement("button");
  search.textContent = "Pesquisar PDFs na Internet";

  search.onclick = () => {
    const query = encodeURIComponent(
      "manual escolar Moçambique PDF " +
      level + " " + subject
    );

    window.open(
      "https://www.google.com/search?q=" + query,
      "_blank"
    );
  };

  container.appendChild(search);
}

async function askSuperMeta() {
  const question =
    document.getElementById("aiQuestion").value.trim();

  const answer =
    document.getElementById("aiAnswer");

  if (!question) {
    answer.textContent = "Escreve uma pergunta primeiro.";
    return;
  }

  answer.textContent =
    "A ligação à inteligência artificial ainda não foi configurada. " +
    "Esta versão não inventa respostas nem simula uma API funcional.";
}
</script>
