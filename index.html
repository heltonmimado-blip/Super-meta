
<!-- SUPER META IA - SISTEMA DE VOZ -->
<section id="voiceSettings" style="
  background:#101b35;
  color:white;
  padding:20px;
  border-radius:15px;
  margin:15px;
  font-family:Arial,sans-serif;
">
  <h2>🎙️ Voz do Professor IA</h2>

  <p>Escolhe como queres ouvir o Professor IA.</p>

  <select id="voiceChoice" style="
    width:100%;
    padding:12px;
    border-radius:9px;
    margin-bottom:12px;
  ">
    <option value="female">Voz feminina – Português de Portugal</option>
    <option value="male">Voz masculina – Português de Portugal</option>
  </select>

  <button onclick="testAppVoice()" style="
    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:9px;
    font-weight:bold;
  ">🔊 Testar voz</button>

  <button onclick="stopAppVoice()" style="
    width:100%;
    padding:13px;
    margin-top:10px;
    background:#dc2626;
    color:white;
    border:0;
    border-radius:9px;
  ">⏹️ Parar voz</button>

  <p id="voiceStatus">Voz feminina selecionada.</p>
</section>

<script>
(function () {
  const selector = document.getElementById("voiceChoice");
  const status = document.getElementById("voiceStatus");

  if (!selector || !status) return;

  let voices = [];

  function loadVoices() {
    voices = window.speechSynthesis
      ? speechSynthesis.getVoices()
      : [];
  }

  function getPortugueseVoice(gender) {
    const ptVoices = voices.filter(v =>
      /^pt(-|_)/i.test(v.lang)
    );

    if (!ptVoices.length) return null;

    const portugalVoices = ptVoices.filter(v =>
      /^pt-PT$/i.test(v.lang)
    );

    const available = portugalVoices.length
      ? portugalVoices
      : ptVoices;

    const genderWords = gender === "female"
      ? ["female", "feminina", "woman"]
      : ["male", "masculina", "man"];

    return available.find(v =>
      genderWords.some(word =>
        v.name.toLowerCase().includes(word)
      )
    ) || available[0];
  }

  window.speakApp = function (message) {
    if (!("speechSynthesis" in window)) {
      status.textContent = "Este navegador não suporta voz.";
      return;
    }

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(message);
    const gender = selector.value;
    const voice = getPortugueseVoice(gender);

    if (voice) {
      utterance.voice = voice;
      utterance.lang = voice.lang;
    } else {
      utterance.lang = "pt-PT";
    }

    utterance.rate = 0.92;
    utterance.pitch = gender === "female" ? 1.08 : 0.88;

    utterance.onstart = () => {
      status.textContent = "O Professor IA está a falar...";
    };

    utterance.onend = () => {
      status.textContent = "Pronto para conversar.";
    };

    utterance.onerror = () => {
      status.textContent = "Não foi possível reproduzir a voz.";
    };

    speechSynthesis.speak(utterance);
  };

  window.testAppVoice = function () {
    speakApp(
      "Olá! Bem-vindo ao Super Meta IA. Sou a tua professora virtual. Estou aqui para te ajudar a aprender."
    );
  };

  window.stopAppVoice = function () {
    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
      status.textContent = "Voz parada.";
    }
  };

  selector.value = localStorage.getItem("superMetaVoice") || "female";

  selector.addEventListener("change", function () {
    localStorage.setItem("superMetaVoice", selector.value);

    status.textContent = selector.value === "female"
      ? "Voz feminina selecionada."
      : "Voz masculina selecionada.";

    speechSynthesis.cancel();
  });

  loadVoices();

  if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
})();
</script>
