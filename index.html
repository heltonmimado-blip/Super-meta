<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super-meta v5 - IA Global</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f1f5f9; color: #333; display: flex; flex-direction: column; height: 100vh; }
        header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: #fff; padding: 18px; text-align: center; }
        h1 { margin: 0; font-size: 22px; }
        .container { padding: 12px; max-width: 600px; margin: auto; width: 100%; flex: 1; display: flex; flex-direction: column; box-sizing: border-box; }
        .card { background: #fff; margin: 8px 0; padding: 14px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        select, input, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 16px; margin-top: 8px; box-sizing: border-box; }
        button { background: #1e40af; color: #fff; border: 0; font-weight: bold; cursor: pointer; }
        .chat-box { flex: 1; background: #fff; border-radius: 14px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; line-height: 1.4; }
        .msg-user { background: #3b82f6; color: #fff; align-self: flex-end; }
        .msg-ai { background: #e2e8f0; color: #1e293b; align-self: flex-start; }
        .input-area { display: flex; gap: 6px; }
        .input-area input { margin-top: 0; flex: 1; }
        .input-area button { margin-top: 0; width: 80px; }
        .escondido { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>🤖 Super-meta v5 AI</h1>
        <p style="margin:4px 0 0; font-size:13px;">O teu Tutor Inteligente Global</p>
    </header>

    <div class="container">
        <!-- ECRÃ DE CONFIGURAÇÃO GLOBAL -->
        <div id="ecra-setup" class="card">
            <h3>🌍 Configuração Inicial</h3>
            <label><b>Escolhe o teu País:</b></label>
            <select id="pais-select">
                <option value="MZ">Moçambique</option>
                <option value="PT">Portugal</option>
                <option value="BR">Brasil</option>
                <option value="AO">Angola</option>
                <option value="OUTRO">Outro País / Global</option>
            </select>

            <label style="margin-top:12px; display:block;"><b>Idioma de Ensino:</b></label>
            <select id="idioma-select">
                <option value="pt">Português</option>
                <option value="en">English (Global)</option>
                <option value="fr">Français</option>
            </select>

            <button onclick="iniciarApp()" style="margin-top:16px;">🚀 Entrar no Super-meta AI</button>
        </div>

        <!-- ECRÃ DE CHAT INTELIGENTE (ESTILO GPT/GEMINI) -->
        <div id="ecra-chat" class="escondido" style="display:flex; flex-direction:column; flex:1;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span id="info-local" style="font-size:13px; font-weight:bold; color:#1e40af;"></span>
                <button onclick="mudarConfig()" style="width:auto; padding:6px 12px; font-size:12px; background:#64748b;">⚙️ Mudar</button>
            </div>

            <div id="chat-historico" class="chat-box">
                <div class="msg msg-ai">Olá! Sou o teu assistente Super-meta AI. Pergunta-me qualquer dúvida sobre matemática, física, história ou qualquer disciplina do teu país! Como posso ajudar hoje?</div>
            </div>

            <div class="input-area">
                <input type="text" id="pergunta-input" placeholder="Escreve a tua dúvida..." onkeypress="if(event.key==='Enter') enviarMensagem()">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let configUtilizador = { pais: "MZ", idioma: "pt" };

        function iniciarApp() {
            configUtilizador.pais = document.getElementById('pais-select').value;
            configUtilizador.idioma = document.getElementById('idioma-select').value;

            document.getElementById('info-local').innerText = `País: ${configUtilizador.pais} | Idioma: ${configUtilizador.idioma.toUpperCase()}`;
            document.getElementById('ecra-setup').classList.add('escondido');
            document.getElementById('ecra-chat').classList.remove('escondido');
        }

        function mudarConfig() {
            document.getElementById('ecra-chat').classList.add('escondido');
            document.getElementById('ecra-setup').classList.remove('escondido');
        }

        function enviarMensagem() {
            const input = document.getElementById('pergunta-input');
            const texto = input.value.trim();
            if(!texto) return;

            const historico = document.getElementById('chat-historico');

            // Mensagem do utilizador
            historico.innerHTML += `<div class="msg msg-user">${texto}</div>`;
            input.value = "";
            historico.scrollTop = historico.scrollHeight;

            // Simulação de resposta inteligente baseada no contexto global
            setTimeout(() => {
                let respostaAI = `Com base no currículo adaptado para o país selecionado (${configUtilizador.pais}), sobre "${texto}": esta é uma excelente questão de estudo! As matérias fundamentais cobrem conceitos teóricos e práticos essenciais para o teu nível académico. Quer aprofundar com exercícios práticos?`;
                
                if(configUtilizador.idioma === 'en') {
                    respostaAI = `Based on the curriculum for your region (${configUtilizador.pais}), regarding "${texto}": this is a great study question! Let me know if you want detailed exercises.`;
                }

                historico.innerHTML += `<div class="msg msg-ai">${respostaAI}</div>`;
                historico.scrollTop = historico.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
