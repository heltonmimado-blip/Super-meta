<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super-meta v6 - Ultimate AI</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f1f5f9; color: #333; display: flex; flex-direction: column; height: 100vh; }
        header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: #fff; padding: 16px; text-align: center; }
        h1 { margin: 0; font-size: 20px; }
        .container { padding: 10px; max-width: 600px; margin: auto; width: 100%; flex: 1; display: flex; flex-direction: column; box-sizing: border-box; }
        .card { background: #fff; margin: 6px 0; padding: 14px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        select, input, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 15px; margin-top: 6px; box-sizing: border-box; }
        button { background: #1e40af; color: #fff; border: 0; font-weight: bold; cursor: pointer; }
        .btn-secundario { background: #0ea5e9; }
        .chat-box { flex: 1; background: #fff; border-radius: 14px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 8px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.4; font-size: 15px; }
        .msg-user { background: #3b82f6; color: #fff; align-self: flex-end; }
        .msg-ai { background: #e2e8f0; color: #1e293b; align-self: flex-start; }
        .input-area { display: flex; gap: 6px; align-items: center; }
        .input-area input { margin-top: 0; flex: 1; }
        .input-area button { margin-top: 0; width: auto; padding: 12px 14px; }
        .escondido { display: none; }
        .preview-img { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>🎙️ Super-meta v6 AI</h1>
        <p style="margin:2px 0 0; font-size:12px;">Voz Automática, Screenshots & Estudo Global</p>
    </header>

    <div class="container">
        <!-- ECRÃ DE CONFIGURAÇÃO -->
        <div id="ecra-setup" class="card">
            <h3>⚙️ Configuração do Assistente</h3>
            
            <label><b>País / Região:</b></label>
            <select id="pais">
                <option value="MZ">Moçambique</option>
                <option value="PT">Portugal</option>
                <option value="BR">Brasil</option>
                <option value="AO">Angola</option>
                <option value="Global">Outro / Global</option>
            </select>

            <label style="margin-top:10px; display:block;"><b>Voz do Assistente:</b></label>
            <select id="tipo-voz">
                <option value="feminina">Feminina</option>
                <option value="masculina">Masculina</option>
            </select>

            <button onclick="iniciarSuperMeta()" style="margin-top:14px;">🚀 Entrar no Super-meta</button>
        </div>

        <!-- ECRÃ DE CHAT -->
        <div id="ecra-chat" class="escondido" style="display:flex; flex-direction:column; flex:1;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <span id="status-voz" style="font-size:12px; font-weight:bold; color:#1e40af;">🎧 Voz Ativa</span>
                <button onclick="mudarConfig()" style="width:auto; padding:4px 10px; font-size:11px; background:#64748b;">⚙️ Definições</button>
            </div>

            <div id="chat-historico" class="chat-box">
                <div class="msg msg-ai">Olá! Sou o teu Super-meta v6. Podes enviar dúvidas, screenshots ou pedir dicas de estudo. Eu respondo e leio automaticamente para ti!</div>
            </div>

            <div id="preview-container" class="escondido card" style="padding: 8px; margin-bottom: 6px;">
                <span style="font-size: 12px; font-weight: bold;">📸 Screenshot anexado:</span>
                <img id="img-preview" class="preview-img">
                <button onclick="removerImagem()" style="background:#ef4444; padding:6px; font-size:12px; margin-top:4px;">Remover Imagem</button>
            </div>

            <div class="input-area">
                <input type="file" id="input-file" accept="image/*" style="display:none" onchange="carregarImagem(event)">
                <button type="button" onclick="document.getElementById('input-file').click()" class="btn-secundario" title="Enviar Screenshot">📷</button>
                <input type="text" id="pergunta-input" placeholder="Escreve a tua dúvida..." onkeypress="if(event.key==='Enter') enviarMensagem()">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let config = { pais: "MZ", voz: "feminina" };
        let imagemBase64 = null;

        function iniciarSuperMeta() {
            config.pais = document.getElementById('pais').value;
            config.voz = document.getElementById('tipo-voz').value;

            document.getElementById('ecra-setup').classList.add('escondido');
            document.getElementById('ecra-chat').classList.remove('escondido');
            falarTexto("Olá! O Super-meta está pronto. Como posso ajudar nos teus estudos hoje?");
        }

        function mudarConfig() {
            document.getElementById('ecra-chat').classList.add('escondido');
            document.getElementById('ecra-setup').classList.remove('escondido');
        }

        function carregarImagem(event) {
            const ficheiro = event.target.files[0];
            if (ficheiro) {
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    imagemBase64 = e.target.result;
                    document.getElementById('img-preview').src = imagemBase64;
                    document.getElementById('preview-container').classList.remove('escondido');
                }
                leitor.readAsDataURL(ficheiro);
            }
        }

        function removerImagem() {
            imagemBase64 = null;
            document.getElementById('preview-container').classList.add('escondido');
            document.getElementById('input-file').value = "";
        }

        function falarTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-PT';
                window.speechSynthesis.speak(utterance);
            }
        }

        function enviarMensagem() {
            const input = document.getElementById('pergunta-input');
            const texto = input.value.trim();
            if (!texto && !imagemBase64) return;

            const historico = document.getElementById('chat-historico');
            let conteudoUser = texto;

            if (imagemBase64) {
                conteudoUser += `<br><img src="${imagemBase64}" class="preview-img">`;
            }

            historico.innerHTML += `<div class="msg msg-user">${conteudoUser}</div>`;
            input.value = "";
            
            let imgTemp = imagemBase64;
            removerImagem();
            historico.scrollTop = historico.scrollHeight;

            setTimeout(() => {
                let resposta = `Com base no teu currículo (${config.pais}), analisei a tua dúvida. Deves focar-te nos conceitos fundamentais, estruturar o teu raciocínio passo a passo e praticar exercícios semelhantes.`;
                
                if(imgTemp) {
                    resposta = `Recebi o teu screenshot com sucesso! Analisei a imagem e o exercício apresentado. Vamos resolvê-lo passo a passo aplicando a matéria correta.`;
                }

                historico.innerHTML += `<div class="msg msg-ai">${resposta}</div>`;
                historico.scrollTop = historico.scrollHeight;
                
                // Fala automaticamente a resposta em voz alta
                falarTexto(resposta);
            }, 800);
        }
    </script>
</body>
</html>
