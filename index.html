
<!-- SUPER META IA: BIBLIOTECA, VOZ E CONVERSA -->

<style>
#sm-extra {
  color: #fff;
  background: #101a35;
  padding: 18px;
  border-radius: 18px;
  margin: 15px auto;
  max-width: 900px;
  font-family: Arial, sans-serif;
}
#sm-extra h2 { color: #70b7ff; }
#sm-extra button, #sm-extra select, #sm-extra input {
  padding: 12px;
  border-radius: 9px;
  border: 0;
  margin: 5px 0;
}
#sm-extra button {
  background: #2878ef;
  color: white;
  cursor: pointer;
}
#sm-extra input, #sm-extra select {
  width: 100%;
  box-sizing: border-box;
  background: #fff;
  color: #111;
}
.sm-panel {
  background: #1b294b;
  padding: 14px;
  border-radius: 12px;
  margin: 14px 0;
}
#sm-messages {
  height: 230px;
  overflow-y: auto;
  background: #0b142b;
  padding: 12px;
  border-radius: 10px;
}
.sm-message {
  padding: 10px;
  margin: 7px 0;
  border-radius: 9px;
  background: #263b65;
  overflow-wrap: anywhere;
}
.sm-user { background: #245a9c; }
#sm-pdf {
  width: 100%;
  height: 450px;
  background: white;
  border: none;
  margin-top: 12px;
}
</style>

<div id="sm-extra">

  <h2>🎓 Super Meta IA</h2>
  <p>Biblioteca escolar, assistente e comandos de voz.</p>

  <!-- VOZ -->
  <div class="sm-panel">
    <h3>🔊 Configuração da voz</h3>

    <label>Escolher voz:</label>
    <select id="sm-voice"></select>

    <label>Tom da voz:</label>
    <select id="sm-pitch">
      <option value="0.8">Grave</option>
      <option value="1" selected>Normal</option>
      <option value="1.3">Agudo</option>
    </select>

    <label>Velocidade:</label>
    <select id="sm-speed">
      <option value="0.8">Lenta</option>
      <option value="1" selected>Normal</option>
      <option value="1.2">Rápida</option>
    </select>

    <button onclick="smSpeak('Olá! Sou o Super Meta IA. Estou pronto para ajudar nos teus estudos.')">
      🔊 Testar voz
    </button>

    <button onclick="smStop()">⏹ Parar áudio</button>
    <p id="sm-voice-status">Aguardando configuração da voz.</p>
  </div>

  <!-- CONVERSA -->
  <div class="sm-panel">
    <h3>🤖 Conversar com Super Meta</h3>

    <div id="sm-messages">
      <div class="sm-message">
        Super Meta: Olá! Como posso ajudar-te hoje?
      </div>
    </div>

    <input id="sm-question"
      placeholder="Escreve uma mensagem..."
      onkeydown="if(event.key==='Enter') smSend()">

    <button onclick="smSend()">Enviar mensagem</button>
    <button onclick="smListen()">🎤 Falar</button>
  </div>

  <!-- BIBLIOTECA -->
  <div class="sm-panel">
    <h3>📚 Biblioteca Escolar</h3>

    <label>País:</label>
    <select id="sm-country">
      <option value="Moçambique">Moçambique</option>
      <option value="Angola">Angola</option>
      <option value="Portugal">Portugal</option>
      <option value="Brasil">Brasil</option>
      <option value="Cabo Verde">Cabo Verde</option>
      <option value="Guiné-Bissau">Guiné-Bissau</option>
      <option value="São Tomé e Príncipe">São Tomé e Príncipe</option>
      <option value="África do Sul">África do Sul</option>
    </select>

    <label>Classe:</label>
    <select id="sm-class">
      <option value="1.ª classe">1.ª classe</option>
      <option value="2.ª classe">2.ª classe</option>
      <option value="3.ª classe">3.ª classe</option>
      <option value="4.ª classe">4.ª classe</option>
      <option value="5.ª classe">5.ª classe</option>
      <option value="6.ª classe">6.ª classe</option>
      <option value="7.ª classe">7.ª classe</option>
      <option value="8.ª classe">8.ª classe</option>
      <option value="9.ª classe">9.ª classe</option>
      <option value="10.ª classe">10.ª classe</option>
      <option value="11.ª classe">11.ª classe</option>
      <option value="12.ª classe">12.ª classe</option>
    </select>

    <label>Disciplina:</label>
    <select id="sm-subject">
      <option>Matemática</option>
      <option>Português</option>
      <option>Física</option>
      <option>Química</option>
      <option>Biologia</option>
      <option>História</option>
      <option>Geografia</option>
      <option>Inglês</option>
      <option>TIC</option>
    </select>

    <p>Adicionar um livro escolar em PDF:</p>
    <input type="file" id="sm-book-file" accept=".pdf,application/pdf">

    <button onclick="smAddBook()">Adicionar livro</button>

    <div id="sm-book-list">
      <p>Ainda não adicionaste livros.</p>
    </div>

    <iframe id="sm-pdf" title="Leitor de livros PDF"></iframe>
  </div>

</div>

<script>
(function () {
  const $ = id => document.getElementById(id);

  let smLastAnswer = "";
  let smBooks = [];

  // VOZ
  function smLoadVoices() {
    const select = $("sm-voice");
    if (!select) return;

    const voices = window.speechSynthesis
      ? speechSynthesis.getVoices()
      : [];

    select.innerHTML = "";

    voices.forEach((voice, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = voice.name + " (" + voice.lang + ")";
      select.appendChild(option);
    });

    $("sm-voice-status").textContent = voices.length
      ? "Vozes disponíveis: " + voices.length
      : "Não foram encontradas vozes. Verifica as definições de voz do Android.";
  }

  window.smSpeak = function (text) {
    if (!("speechSynthesis" in window)) {
      $("sm-voice-status").textContent =
        "Este navegador não suporta leitura de voz.";
      return;
    }

    if (!text || !text.trim()) return;

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const index = Number($("sm-voice").value);
    const voice = voices[index];

    if (voice) utterance.voice = voice;

    utterance.lang = voice?.lang || "pt-PT";
    utterance.pitch = Number($("sm-pitch").value);
    utterance.rate = Number($("sm-speed").value);

    utterance.onstart = () => {
      $("sm-voice-status").textContent = "A falar...";
    };

    utterance.onend = () => {
      $("sm-voice-status").textContent = "Áudio terminado.";
    };

    utterance.onerror = event => {
      $("sm-voice-status").textContent =
        "Erro na voz: " + event.error;
    };

    speechSynthesis.speak(utterance);
  };

  window.smStop = function () {
    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
      $("sm-voice-status").textContent = "Áudio parado.";
    }
  };

  if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = smLoadVoices;
    smLoadVoices();
    setTimeout(smLoadVoices, 1000);
  }

  // RESPOSTAS BÁSICAS
  function smAnswer(message) {
    const text = message.toLowerCase().trim();

    if (/^(oi|olá|ola|bom dia|boa tarde|boa noite|hey)\b/.test(text)) {
      if (text.includes("boa noite")) {
        return "Boa noite! Como estás? Em que posso ajudar nos teus estudos?";
      }
      if (text.includes("boa tarde")) {
        return "Boa tarde! Seja bem-vindo ao Super Meta IA. Como posso ajudar?";
      }
      if (text.includes("bom dia")) {
        return "Bom dia! Espero que tenhas um excelente dia de aprendizagem.";
      }
      return "Olá! Sou o Super Meta IA. Estou aqui para ajudar-te a estudar.";
    }

    if (text.includes("obrigado") || text.includes("obrigada")) {
      return "De nada! Estou aqui para ajudar.";
    }

    if (text.includes("quem és") || text.includes("quem e voce")) {
      return "Sou o Super Meta IA, um assistente educativo.";
    }

    if (text.includes("ajuda") || text.includes("o que podes fazer")) {
      return "Posso conversar, ler respostas em voz alta e ajudar a organizar os teus livros escolares. Para respostas escolares avançadas, preciso de uma ligação a um serviço de inteligência artificial.";
    }

    if (/^[\d\s()+\-*/.,]+$/.test(text)) {
      try {
        const normalized = text.replace(",", ".");
        if (!/^[\d\s()+\-*/.]+$/.test(normalized)) {
          throw new Error("Expressão inválida");
        }
        const result = Function('"use strict"; return (' + normalized + ')')();
        if (Number.isFinite(result)) return "O resultado é " + result;
      } catch (e) {}
    }

    return "Recebi a tua mensagem: " + message +
      ". Ainda não estou ligado a um serviço de IA para responder a todas as perguntas. Posso responder a cumprimentos e algumas operações simples.";
  }

  window.smSend = function () {
    const input = $("sm-question");
    const message = input.value.trim();

    if (!message) {
      input.focus();
      return;
    }

    const box = $("sm-messages");

    const user = document.createElement("div");
    user.className = "sm-message sm-user";
    user.textContent = "Tu: " + message;
    box.appendChild(user);

    const answer = smAnswer(message);
    smLastAnswer = answer;

    const bot = document.createElement("div");
    bot.className = "sm-message";
    bot.textContent = "Super Meta: " + answer;
    box.appendChild(bot);

    input.value = "";
    box.scrollTop = box.scrollHeight;

    smSpeak(answer);
  };

  // RECONHECIMENTO DE VOZ
  window.smListen = function () {
    const Recognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!Recognition) {
      $("sm-voice-status").textContent =
        "O reconhecimento de voz não está disponível neste navegador. Usa o teclado ou experimenta o Chrome.";
      return;
    }

    const recognition = new Recognition();
    recognition.lang = "pt-MZ";
    recognition.interimResults = false;

    recognition.onstart = () => {
      $("sm-voice-status").textContent = "Estou a ouvir...";
    };

    recognition.onresult = event => {
      $("sm-question").value =
        event.results[0][0].transcript;
      smSend();
    };

    recognition.onerror = event => {
      $("sm-voice-status").textContent =
        "Erro no microfone: " + event.error;
    };

    recognition.start();
  };

  // BIBLIOTECA PDF
  window.smAddBook = function () {
    const file = $("sm-book-file").files[0];

    if (!file) {
      alert("Seleciona primeiro um livro PDF.");
      return;
    }

    if (file.type !== "application/pdf") {
      alert("Seleciona um ficheiro PDF válido.");
      return;
    }

    const url = URL.createObjectURL(file);

    const book = {
      name: file.name,
      country: $("sm-country").value,
      grade: $("sm-class").value,
      subject: $("sm-subject").value,
      url: url
    };

    smBooks.push(book);
    smRenderBooks();
    $("sm-book-file").value = "";
  };

  function smRenderBooks() {
    const list = $("sm-book-list");
    list.innerHTML = "";

    smBooks.forEach((book, index) => {
      const item = document.createElement("div");
      item.className = "sm-message";

      const title = document.createElement("p");
      title.textContent =
        book.name + " — " + book.country + " — " +
        book.grade + " — " + book.subject;

      const open = document.createElement("button");
      open.textContent = "Abrir livro";
      open.onclick = () => {
        $("sm-pdf").src = book.url;
      };

      item.appendChild(title);
      item.appendChild(open);
      list.appendChild(item);
    });
  }
})();
</script>
