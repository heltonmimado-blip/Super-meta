
<section id="books" class="page">
 <h2>📚 Biblioteca Escolar</h2>

 <div class="card">
  <h3>Pesquisar livros escolares</h3>

  <label for="libraryLevel">Classe</label>
  <select id="libraryLevel">
   <option value="Todas">Todas as classes</option>
   <option>1.ª classe</option>
   <option>2.ª classe</option>
   <option>3.ª classe</option>
   <option>4.ª classe</option>
   <option>5.ª classe</option>
   <option>6.ª classe</option>
   <option>7.ª classe</option>
   <option>8.ª classe</option>
   <option>9.ª classe</option>
   <option>10.ª classe</option>
   <option>11.ª classe</option>
   <option>12.ª classe</option>
  </select>

  <div class="field">
   <label for="librarySubject">Disciplina</label>
   <select id="librarySubject">
    <option>Todas</option>
    <option>Português</option>
    <option>Matemática</option>
    <option>Física</option>
    <option>Química</option>
    <option>Biologia</option>
    <option>História</option>
    <option>Geografia</option>
    <option>Inglês</option>
    <option>Francês</option>
    <option>TIC</option>
    <option>Filosofia</option>
   </select>
  </div>

  <button class="btn full" onclick="searchSchoolBooks()">
   🔎 Procurar livros
  </button>
 </div>

 <div class="card">
  <h3>📖 Livros encontrados</h3>
  <div id="onlineBooks">
   Escolhe a classe e a disciplina para procurar livros.
  </div>
 </div>

 <div class="card">
  <h3>📥 Adicionar os meus PDFs</h3>
  <p class="small">Guarda os teus manuais escolares no aplicativo.</p>

  <label for="bookType">Tipo de livro</label>
  <select id="bookType">
   <option>Livro escolar</option>
   <option>Manual de exercícios</option>
   <option>Dicionário</option>
   <option>Gramática</option>
   <option>Outro</option>
  </select>

  <label for="bookSubject">Disciplina</label>
  <select id="bookSubject">
   <option>Português</option>
   <option>Matemática</option>
   <option>Física</option>
   <option>Química</option>
   <option>Biologia</option>
   <option>História</option>
   <option>Geografia</option>
   <option>Inglês</option>
   <option>TIC</option>
  </select>

  <label for="bookLevel">Classe</label>
  <select id="bookLevel">
   <option>1.ª classe</option>
   <option>2.ª classe</option>
   <option>3.ª classe</option>
   <option>4.ª classe</option>
   <option>5.ª classe</option>
   <option>6.ª classe</option>
   <option>7.ª classe</option>
   <option>8.ª classe</option>
   <option>9.ª classe</option>
   <option>10.ª classe</option>
   <option>11.ª classe</option>
   <option>12.ª classe</option>
  </select>

  <label for="bookName">Nome do livro</label>
  <input id="bookName" placeholder="Nome do manual">

  <label for="bookFile">Selecionar PDF</label>
  <input type="file" id="bookFile" accept="application/pdf">

  <button class="btn full" onclick="saveBook()">Guardar PDF</button>
 </div>

 <div class="card">
  <h3>📚 A minha biblioteca</h3>
  <div id="bookList">A carregar...</div>
 </div>

 <div class="card hidden" id="reader">
  <h3 id="readerTitle">Leitor PDF</h3>
  <iframe id="pdfFrame" title="Leitor PDF"></iframe>
  <button class="btn secondary full" onclick="closeReader()">Fechar livro</button>
 </div>
</section>
